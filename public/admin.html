<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IPTV Admin Panel</title>
  <style>
    *{box-sizing:border-box; font-family:Arial; max-width:900px; margin:0 auto; padding:10px;}
    h2{color:#2563eb; margin:15px 0; border-bottom:2px solid #eee; padding-bottom:5px;}
    form{background:#f9fafb; padding:15px; border-radius:8px; margin-bottom:20px;}
    input,textarea,button{width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:4px;}
    button{background:#2563eb; color:white; border:none; cursor:pointer; font-weight:bold; margin-top:8px;}
    button:hover{background:#1d4ed8;}
    .msg{padding:8px; margin:8px 0; border-radius:4px; display:none;}
    .success{background:#dcfce7; color:#166534;}
    .error{background:#fee2e2; color:#991b1b;}
  </style>
</head>
<body>
  <h1 style="text-align:center; color:#1e40af;">📺 IPTV Admin Panel</h1>

  <!-- ADD USER -->
  <h2>👤 Add User</h2>
  <form id="userForm">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <input name="expiry" placeholder="Expiry (YYYY-MM-DD)" value="2030-12-31">
    <input name="connections" type="number" placeholder="Max Connections" value="1">
    <button type="submit">Add User</button>
    <div class="msg" id="userMsg"></div>
  </form>

  <!-- ADD CHANNEL -->
  <h2>📡 Add Live Channel</h2>
  <form id="channelForm">
    <input name="name" placeholder="Channel Name" required>
    <input name="logo" placeholder="Logo URL">
    <input name="url" placeholder="Stream URL (.m3u8 / .ts)" required>
    <button type="submit">Add Channel</button>
    <div class="msg" id="chMsg"></div>
  </form>

  <!-- ADD MOVIE -->
  <h2>🎬 Add Movie</h2>
  <form id="movieForm">
    <input name="name" placeholder="Movie Title" required>
    <input name="stream_icon" placeholder="Poster URL">
    <input name="direct_source" placeholder="Direct Stream URL" required>
    <textarea name="description" placeholder="Description" rows="2"></textarea>
    <button type="submit">Add Movie</button>
    <div class="msg" id="mvMsg"></div>
  </form>

  <!-- ADD SERIES -->
  <h2>🎞️ Add Series</h2>
  <form id="seriesForm">
    <input name="name" placeholder="Series Name" required>
    <input name="cover" placeholder="Cover/Poster URL">
    <textarea name="seasons" placeholder='Seasons JSON: [{"season":1,"episodes":[{"id":1,"name":"Ep 1","source":"URL"}]}]' rows="4"></textarea>
    <button type="submit">Add Series</button>
    <div class="msg" id="serMsg"></div>
  </form>

  <script>
    async function submitForm(form, endpoint, msgId) {
      const btn = form.querySelector("button");
      const msgBox = document.getElementById(msgId);
      btn.disabled = true; btn.innerText = "Saving...";
      msgBox.style.display = "none";

      const body = Object.fromEntries(new FormData(form));
      if (body.seasons) try { body.seasons = JSON.parse(body.seasons); } catch(e){}

      const res = await fetch(endpoint, {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      
      msgBox.className = `msg ${data.success?"success":"error"}`;
      msgBox.innerText = data.msg;
      msgBox.style.display = "block";
      btn.disabled = false; btn.innerText = "Add";
      if(data.success) form.reset();
    }

    document.getElementById("userForm").onsubmit = e=>{e.preventDefault(); submitForm(e.target,"/admin/add-user","userMsg");};
    document.getElementById("channelForm").onsubmit = e=>{e.preventDefault(); submitForm(e.target,"/admin/add-channel","chMsg");};
    document.getElementById("movieForm").onsubmit = e=>{e.preventDefault(); submitForm(e.target,"/admin/add-movie","mvMsg");};
    document.getElementById("seriesForm").onsubmit = e=>{e.preventDefault(); submitForm(e.target,"/admin/add-series","serMsg");};
  </script>
</body>
</html>
